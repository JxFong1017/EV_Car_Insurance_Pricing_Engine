[tool.poetry]
name = "voltvision-backend"
version = "0.1.0"
description = "VoltVision EV Pricing Engine Backend"
authors = ["JX <jx@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
python-dotenv = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
